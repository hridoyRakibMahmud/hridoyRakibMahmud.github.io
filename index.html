<meta name="theme-color" content="#080C12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F2EE" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
  // Runs before first paint so content never flashes before the boot sequence.
  (function(){
    try{
      if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
        document.documentElement.className += ' booting js-reveal';
      }
    }catch(e){}

    // Resolve the theme before first paint so there's no flash of the wrong
    // colours. Stored choice wins; otherwise follow the operating system.
    try{
      var saved = window.localStorage.getItem('theme');
      var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.setAttribute(
        'data-theme',
        saved === 'light' || saved === 'dark' ? saved : (prefersLight ? 'light' : 'dark')
      );
    }catch(e){
      document.documentElement.setAttribute('data-theme','dark');
    }
  })();
</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
